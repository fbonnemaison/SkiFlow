name: SkiFlow

options:
  bundleIdPrefix: com.appzilla
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Firma ad hoc: sin cuenta de desarrollador de pago
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  SkiFlow:
    type: application
    platform: macOS
    sources:
      - path: SkiFlow
      # La licencia MIT y los créditos viajan dentro de la app.
      - path: LICENSE
        buildPhase: resources
      - path: CREDITS.md
        buildPhase: resources
      - path: Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.SkiFlow
        PRODUCT_NAME: SkiFlow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkiFlow
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 App-Zilla. Licencia MIT."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SELECTED_FILES: readonly

  SkiFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkiFlowTests
    dependencies:
      - target: SkiFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.SkiFlowTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SkiFlow.app/Contents/MacOS/SkiFlow"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SkiFlow:
    build:
      targets:
        SkiFlow: all
        SkiFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkiFlowTests
    archive:
      config: Release
